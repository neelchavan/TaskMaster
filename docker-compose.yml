services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskmaster
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD: taskmaster
    ports:
      - "5432:5432"
    volumes:
      - taskmaster-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmaster -d taskmaster"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  taskmaster-pg:
